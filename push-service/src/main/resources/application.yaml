server:
  port: 8085

spring:
  application:
    name: push-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      transport:
        dashboard: localhost:8089
      eager: true
      http-method-specify: true

app:
  auth:
    mode: gateway
  jwt:
    secret: ${ta.jwt.secret}
    expiration: 43200000  # 12小时 = 12 * 60 * 60 * 1000
