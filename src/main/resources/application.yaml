spring:
  application:
    name: to-arrive
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${ta.db.host}:${ta.db.port}/${ta.db.name}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${ta.db.username}
    password: ${ta.db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${ta.redis.password}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms

app:
  jwt:
   secret: ${ta.jwt.secret}
   expiration: 43200000  # 12小时 = 12 * 60 * 60 * 1000
  pricing:
    base-fare: 8.00        # 起步价（元），含 included-km 公里
    included-km: 3.00      # 起步价包含里程（公里）
    per-km: 2.00           # 超出部分每公里单价（元）
    per-minute: 0.50       # 每分钟时长费（元）
    assumed-speed-kmh: 30  # 预估时长用的平均车速
  order:
    accept-timeout-minutes: 10  # 待接单订单自动取消的超时窗口（分钟）

