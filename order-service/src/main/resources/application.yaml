server:
  port: 8084

spring:
  application:
    name: order-service
  config:
    import:
      - optional:nacos:ta-common.yaml?group=TA_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${ta.db.host}:${ta.db.port}/${ta.db.name}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${ta.db.username}
    password: ${ta.db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  dispatch:
    radius-km: 3          # 派单搜索半径
    max-drivers: 10       # 单次最多推送的候选司机数

ta:
  db:
    name: order_db
