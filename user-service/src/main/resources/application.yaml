server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import:
      - optional:nacos:ta-common.yaml?group=TA_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${ta.db.host}:${ta.db.port}/${ta.db.name}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${ta.db.username}
    password: ${ta.db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

ta:
  db:
    name: user_db
